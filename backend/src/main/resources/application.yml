server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: financial-delivery-platform
  config:
    import: optional:file:./.env[.properties],optional:file:./backend/.env[.properties]
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:fdp}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

fdp:
  cors:
    allowed-origins: ${FDP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  runtime:
    execution-enabled: ${FDP_EXECUTION_ENABLED:false}
    workspace-root: ${FDP_WORKSPACE_ROOT:./runtime/workspaces}
    static-root: ${FDP_STATIC_ROOT:./runtime/sites}
    data-root: ${FDP_DATA_ROOT:./runtime/data}
    artifact-root: ${FDP_ARTIFACT_ROOT:./runtime/artifacts}
    env-root: ${FDP_ENV_ROOT:./runtime/env}
    nginx-config-file: ${FDP_NGINX_CONFIG_FILE:./runtime/nginx/fdp.conf}
    nginx-public-port: ${FDP_PUBLIC_PORT:8090}
    nginx-reload-command: ${FDP_NGINX_RELOAD_COMMAND:nginx -t && nginx -s reload}
  managed:
    project-root: ${FDP_PROJECT_ROOT:/data/fdp/projects}
    docker-network: ${FDP_DOCKER_NETWORK:fdp-network}
    workspace-mount: ${FDP_WORKSPACE_MOUNT:/workspace}
    config-mount: ${FDP_CONFIG_MOUNT:/fdp}
    mysql-host: ${FDP_PROJECT_DB_HOST:mysql}
    mysql-port: ${FDP_PROJECT_DB_PORT:3306}
    mysql-user: ${FDP_PROJECT_DB_USER:root}
    mysql-password: ${FDP_PROJECT_DB_PASSWORD:${MYSQL_PASSWORD:123456}}
    preview-nginx-container: ${FDP_PREVIEW_NGINX_CONTAINER:fdp-preview-nginx}
    preview-nginx-config-file: ${FDP_PREVIEW_NGINX_CONFIG_FILE:/data/fdp/preview/nginx.conf}
    runtime-images:
      - ${FDP_RUNTIME_IMAGE_JAVA17:eclipse-temurin:17-jre}
      - ${FDP_RUNTIME_IMAGE_JAVA21:eclipse-temurin:21-jre}
      - ${FDP_RUNTIME_IMAGE_NODE20:node:20-bookworm-slim}
      - ${FDP_RUNTIME_IMAGE_NODE22:node:22-bookworm-slim}
  static-source:
    enabled: ${FDP_STATIC_CODEUP_ENABLED:false}
    git-url: ${FDP_STATIC_CODEUP_GIT_URL:}
    branch: ${FDP_STATIC_CODEUP_BRANCH:main}
    username: ${FDP_STATIC_CODEUP_USERNAME:}
    token: ${FDP_STATIC_CODEUP_TOKEN:}
    workspace: ${FDP_STATIC_CODEUP_WORKSPACE:static-codeup}
    root-directory: ${FDP_STATIC_CODEUP_ROOT_DIR:.}
  yunxiao:
    enabled: ${FDP_YUNXIAO_ENABLED:false}
    domain: ${FDP_YUNXIAO_DOMAIN:openapi-rdc.aliyuncs.com}
    organization-id: ${FDP_YUNXIAO_ORGANIZATION_ID:}
    token: ${FDP_YUNXIAO_TOKEN:${FDP_STATIC_CODEUP_TOKEN:}}
    page-size: ${FDP_YUNXIAO_PAGE_SIZE:30}
    packages-download-base-url: ${FDP_YUNXIAO_PACKAGES_DOWNLOAD_BASE_URL:https://packages.aliyun.com}
    packages-username: ${FDP_PACKAGES_USERNAME:}
    packages-token: ${FDP_PACKAGES_TOKEN:${FDP_PACKAGES_PASSWORD:}}
  security:
    credential-key: ${FDP_CREDENTIAL_KEY:}
